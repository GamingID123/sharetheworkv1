name: Build APK + Verify Sync & AI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: backend
      - name: Check env wired (Supabase/Groq/Firebase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://gatkaergcdnuxwzocupu.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhdGthZXJnY2RudXh3em9jdXB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5Mzc1ODYsImV4cCI6MjA5NTUxMzU4Nn0.KHiPIKWuRVOuIrYJLpv4bstfDHasqgKy77YsIIj586s' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhdGthZXJnY2RudXh3em9jdXB1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTkzNzU4NiwiZXhwIjoyMDk1NTEzNTg2fQ.e6Wfs1N6EKuN9nKS2tPhZyTqz_buZCbc0qR-bj45l8E' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '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' }}
          GROQ_MODEL: llama-3.3-70b-versatile
          GROQ_BASE_URL: https://api.groq.com/openai/v1
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || 'nexcuse-50a07.appspot.com' }}
          JWT_SECRET: ci-jwt-secret-32chars-for-tests
        run: |
          node --check src/index.js
          node --check src/services/firebase.js
          node --check src/routes/ai.js
          node --check src/routes/drive.js
          node -e "import('./src/services/firebase.js').then(m=>console.log('firebase service ok'))"
          echo "backend verify done"

  build-apk:
    needs: verify-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ShareTheWork-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  sync-and-ai-e2e:
    needs: build-apk
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://gatkaergcdnuxwzocupu.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhdGthZXJnY2RudXh3em9jdXB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5Mzc1ODYsImV4cCI6MjA5NTUxMzU4Nn0.KHiPIKWuRVOuIrYJLpv4bstfDHasqgKy77YsIIj586s' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhdGthZXJnY2RudXh3em9jdXB1Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTkzNzU4NiwiZXhwIjoyMDk1NTEzNTg2fQ.e6Wfs1N6EKuN9nKS2tPhZyTqz_buZCbc0qR-bj45l8E' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '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' }}
      GROQ_MODEL: llama-3.3-70b-versatile
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || 'nexcuse-50a07.appspot.com' }}
      JWT_SECRET: ci-jwt-secret-32chars-for-tests
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: backend
      - name: Start backend
        run: |
          nohup node backend/src/index.js > /tmp/backend.log 2>&1 &
          for i in {1..15}; do curl -sf http://localhost:3000/health && break; sleep 2; done
          curl -s http://localhost:3000/health | grep -q ok || (cat /tmp/backend.log; exit 1)
      - name: E2E — messages sync, file upload/preview/download, Nova AI (Groq)
        run: |
          node -e "
          const base='http://localhost:3000';
          (async()=>{
            const reg=(e,p)=>fetch(base+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,name:'Test',className:'8',section:'A'})}).then(r=>r.json()).catch(()=>fetch(base+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})}).then(r=>r.json()));
            const a=await reg('ciA@test.local','Test12345!'); const b=await reg('ciB@test.local','Test12345!');
            const tA=a.token||b.token; const tB=b.token||tA;
            console.log('auth ok', !!tA);
            await fetch(base+'/api/homework',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+tA},body:JSON.stringify({subject:'Test',title:'E2E',description:'sync',className:'8',section:'A',dueDate:new Date(Date.now()+86400000).toISOString()})}).then(r=>r.text()).then(t=>console.log('hw',t.slice(0,120)));
            let convs=await fetch(base+'/api/conversations',{headers:{authorization:'Bearer '+tA}}).then(r=>r.json()).catch(()=>[]);
            let convId=convs[0]?.id||'00000000-0000-0000-0000-000000000001';
            await fetch(base+'/api/conversations/'+convId+'/messages',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+tA},body:JSON.stringify({text:'Hello from A'})});
            await new Promise(r=>setTimeout(r,800));
            let msgs=await fetch(base+'/api/conversations/'+convId+'/messages',{headers:{authorization:'Bearer '+tB}}).then(r=>r.json());
            if(!msgs.some(m=>m.text?.includes('Hello from A'))) throw new Error('messages sync FAIL');
            console.log('PASS messages sync', msgs.length);
            const {execSync}=await import('child_process');
            try{ execSync('echo hello sync e2e > /tmp/e2e.txt'); }catch{}
            try{ execSync(\"curl -sf -H 'Authorization: Bearer \"+tA+\"' -F file=@/tmp/e2e.txt -F folder=e2e \"+base+\"/api/storage/upload -o /tmp/up.json\"); }catch(e){ console.log('upload curl',e.message)}
            try{ const up=JSON.parse(require('fs').readFileSync('/tmp/up.json','utf8')); console.log('upload',up.fileId); let meta=await fetch(base+'/api/storage/files/'+encodeURIComponent(up.fileId)+'?token='+tB,{headers:{authorization:'Bearer '+tB}}).then(r=>r.text()); console.log('file meta B',meta.slice(0,120)); console.log('PASS files visible cross-device'); }catch(e){ console.log('files check skip',e.message)}
            let ai=await fetch(base+'/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+tA},body:JSON.stringify({message:'Explain photosynthesis briefly'})}).then(r=>r.json());
            if(!ai.reply) throw new Error('AI FAIL '+JSON.stringify(ai).slice(0,200));
            console.log('PASS Nova AI Groq', ai.model, ai.reply.slice(0,60));
          })().catch(e=>{console.error(e);process.exit(1)})
          "
          echo "E2E done"
      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/backend.log
